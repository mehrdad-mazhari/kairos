[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos-quantum-control"
version = "0.1.0"
description = "Robust quantum optimal control for superconducting transmon X gates"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.2", "scipy==1.17.1", "matplotlib==3.11.0", "qutip==5.3.1", "scqubits==4.3.1"]

[project.optional-dependencies]
gpu = ["jax[cuda12]==0.12.0.1"]
test = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kairos = ["*.json"]
